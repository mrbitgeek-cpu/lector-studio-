<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LectorStudio · tu biblioteca en voz alta</title>
<meta name="description" content="Biblioteca personal de EPUB y PDF que lee en voz alta, reconoce fotocopias y guarda tu avance en el dispositivo.">
<meta name="theme-color" content="#12100c">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LectorStudio">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app" id="app">
  <header class="topbar" id="topbar">
    <a class="brand" href="#/" aria-label="LectorStudio, ir a la biblioteca">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="26" height="26"><path d="M4 7.5c4-1.6 8-1.6 12 0v18c-4-1.6-8-1.6-12 0z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M28 7.5c-4-1.6-8-1.6-12 0v18c4-1.6 8-1.6 12 0z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M16 9v15" stroke="currentColor" stroke-width="1.2" opacity=".55"/></svg>
      </span>
      <span class="brand-text"><strong>Lector</strong>Studio</span>
    </a>
    <div class="topbar-actions">
      <span class="storage-chip" id="storageChip" title="Espacio usado en este dispositivo" hidden></span>
      <button class="btn btn-ghost" id="installBtn" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Instalar</span>
      </button>
      <button class="btn btn-ghost" id="settingsBtn" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.56-1.1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>
</div>

<!-- Reproductor persistente -->
<div class="player" id="player" hidden>
  <div class="player-info">
    <div class="player-cover" id="playerCover" aria-hidden="true"></div>
    <div class="player-meta">
      <div class="player-title" id="playerTitle">—</div>
      <div class="player-sub" id="playerSub">—</div>
    </div>
  </div>
  <div class="player-controls">
    <button class="pbtn" id="prevBtn" aria-label="Frase anterior" title="Frase anterior (←)">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M18 5v14l-9-7zM6 5v14" fill="currentColor"/></svg>
    </button>
    <button class="pbtn pbtn-play" id="playBtn" aria-label="Reproducir" title="Reproducir / pausar (espacio)">
      <svg class="ico-play" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>
      <svg class="ico-pause" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" hidden><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>
      <span class="spinner" hidden aria-hidden="true"></span>
    </button>
    <button class="pbtn" id="nextBtn" aria-label="Frase siguiente" title="Frase siguiente (→)">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 5v14l9-7zM18 5v14" fill="currentColor"/></svg>
    </button>
  </div>
  <div class="player-extra">
    <button class="chip-btn" id="speedBtn" title="Velocidad de lectura" aria-label="Velocidad de lectura">1.0×</button>
    <button class="chip-btn" id="voiceBtn" title="Voz" aria-label="Elegir voz">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 10v4h3l4 3V7L7 10zM16 8.5a5 5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="voiceLabel">Voz</span>
    </button>
    <button class="chip-btn" id="tocBtn" title="Índice" aria-label="Índice del libro">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="player-progress" aria-hidden="true"><div id="playerProgressFill"></div></div>
</div>

<!-- Hoja modal -->
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <header class="sheet-head">
    <h2 id="sheetTitle">Ajustes</h2>
    <button class="icon-btn" id="sheetClose" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </header>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="dropveil" id="dropveil" hidden><div>Suelta para añadir a la biblioteca</div></div>
<input type="file" id="fileInput" accept=".epub,.pdf,application/epub+zip,application/pdf" multiple hidden>

<!-- Librerías locales: nada se carga desde internet. -->
<script src="vendor/jszip/jszip.min.js"></script>
<script src="vendor/tesseract/tesseract.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
